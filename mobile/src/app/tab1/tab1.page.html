<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Slučajevi</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Pretraži slučajeve..."
      (ionInput)="onPretraga($event)"
      animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="ucitaj(); $event.target.complete()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="ucitava" class="loader">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!ucitava">
    <ion-card
      *ngFor="let s of filtrirani"
      class="slucaj-card"
      (click)="otvoriDetalj(s.pomocId)">
      <ion-card-header>
        <ion-card-title>{{ s.naziv }}</ion-card-title>
        <ion-card-subtitle>
          <ion-icon name="person-outline"></ion-icon>
          {{ s.korisnik?.prikazAnonimno ? 'Anonimno' : (s.korisnik?.ime + ' ' + s.korisnik?.prezime) }}
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p class="opis" *ngIf="s.opisPotrebe">{{ s.opisPotrebe }}</p>
        <ion-button fill="clear" size="small" class="ion-float-right">
          Donirajte
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <div *ngIf="!ucitava && filtrirani.length === 0" class="empty-state">
    <ion-icon name="search-outline" color="medium"></ion-icon>
    <p>Nema pronađenih slučajeva.</p>
  </div>
</ion-content>
